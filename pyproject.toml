[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-redteam-lab"
version = "0.1.0"
description = "Self-contained AI security redteam scanner with deterministic fixtures."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KIM3310" }]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
include = ["redteam_lab*"]
